[project]
name = "krillion-bot"
version = "0.1.0"
description = "Krillioniesta — Telegram group bot that tabulates daily Krillion scores"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.15,<4",
    "aiosqlite>=0.20",
    "apscheduler>=3.11,<4",
    "pydantic-settings>=2.6",
    "tzdata>=2024.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8"]

[project.scripts]
krillionbot = "krillionbot.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/krillionbot"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
